server:
  port: 8080

spring:
  application:
    name: internet-billboard
  data:
        mongodb:
          uri: ${MONGODB_URI:mongodb+srv://===============================================================}
          database: ${MONGODB_DATABASE:================================================================}

moyasar:
  # Never commit a real secret key. Set MOYASAR_SECRET_KEY as an
  # environment variable in every real environment.
  secret-key: ${MOYASAR_SECRET_KEY:sk_test_==============================================}
  # Public URL Moyasar should redirect/notify back to after payment.
  # Must be reachable from the internet (e.g. via ngrok in local dev).
  callback-url: ${MOYASAR_CALLBACK_URL:http:=====================================================}
  success-url: ${MOYASAR_SUCCESS_URL:http:===============================================

logging:
  level:
    com.billboard: DEBUG
    org.springframework.web.socket: INFO
